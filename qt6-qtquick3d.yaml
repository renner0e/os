package:
  name: qt6-qtquick3d
  version: "6.9.1"
  epoch: 0
  description: qtquick3d
  copyright:
    - license: LGPL-3.0-or-later

environment:
  contents:
    packages:
      - build-base
      - busybox
      - cmake
      - qt6-qtbase-dev
      - libxkbcommon-dev
      - libglvnd-dev
      - qt6-qtdeclarative-dev
      - qt6-qtshadertools-dev
      - qt6-qtquicktimeline-dev

var-transforms:
  - from: ${{package.version}}
    match: "_"
    replace: "-"
    to: mangled-package-version

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/qt/qtquick3d
      tag: v${{package.version}}
      expected-commit: 9dbdffb662559841b284df117c6360b0e8e587c8

  - uses: cmake/configure

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

update:
  enabled: true
  github:
    identifier: qt/qtquick3d
    use-tag: true
    strip-prefix: v
  ignore-regex-patterns:
    - 'rc\d+$'
    - 'beta\d+$'

subpackages:
  - name: ${{package.name}}-dev
    description: ${{package.name}} development libraries and headers
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - uses: test/pkgconf

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/pkgconf

